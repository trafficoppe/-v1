<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขึ้นทะเบียนถังดับเพลิงใหม่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-danger sticky-top shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">เพิ่มข้อมูลถังดับเพลิง</span>
            <button class="btn btn-outline-light btn-sm" id="btn-back">กลับหน้ารายการ</button>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <form id="add-extinguisher-form">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">ชนิด <span class="text-danger">*</span></label>
                            <select class="form-select" id="type" required>
                                <option value="" disabled selected>เลือกชนิดถังดับเพลิง</option>
                                <option value="ผงเคมีแห้ง (Dry Chemical)">ผงเคมีแห้ง (Dry Chemical)</option>
                                <option value="คาร์บอนไดออกไซด์ (CO2)">คาร์บอนไดออกไซด์ (CO2)</option>
                                <option value="น้ำยาเหลวระเหย (Halotron)">น้ำยาเหลวระเหย (Halotron)</option>
                                <option value="โฟม (Foam)">โฟม (Foam)</option>
                                <option value="น้ำ (Water)">น้ำ (Water)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">ขนาด (ปอนด์) <span class="text-danger">*</span></label>
                            <select class="form-select" id="size" required>
                                <option value="" disabled selected>เลือกขนาด (ปอนด์)</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
    <label class="form-label fw-bold">เลขที่ถัง <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="extId" required>
</div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">หมายเลขครุภัณฑ์ <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="assetCode" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">สถานที่ติดตั้ง <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="location" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">ปีที่ซื้อ <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="year" required>
                    </div>

                    <h6 class="fw-bold text-danger mb-3 border-bottom pb-2">อัปโหลดรูปภาพ</h6>
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">1. รูปตัวถัง <span class="text-danger">*</span></label>
                            <input type="file" class="form-control" id="img1" accept="image/*" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">2. รูปหมายเลขครุภัณฑ์ <span class="text-danger">*</span></label>
                            <input type="file" class="form-control" id="img2" accept="image/*" required>
                        </div>
                    </div>                    

                    <button type="submit" class="btn btn-danger w-100 py-3 fw-bold fs-5 shadow-sm">บันทึกข้อมูลเข้าระบบ</button>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deptKey = urlParams.get('dept') || 'traffic';
        const DEPT_MAP = {
            'traffic': 'งานจราจรและความปลอดภัย',
            'salaya': 'อาคารศาลายา กองกายภาพฯ',
            'mlc': 'ศูนย์การเรียนรู้มหิดล',
            'sitthakarn': 'มหิดลสิทธาคาร',
            'siriwittaya': 'อาคารสิริวิทยา'
        };
        const DEPT_NAME = DEPT_MAP[deptKey] || 'งานจราจรและความปลอดภัย';

        document.getElementById('btn-back').onclick = () => { window.location.href = `list.html?dept=${deptKey}`; };

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) { resolve(""); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); 
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('add-extinguisher-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'กำลังบันทึกและอัปโหลดรูป...';
            submitBtn.disabled = true;

            try {
                const file1 = document.getElementById('img1').files[0];
                const file2 = document.getElementById('img2').files[0];
                const base64Img1 = await getBase64(file1);
                const base64Img2 = await getBase64(file2);

                const payload = {
                    action: "add_extinguisher", department: DEPT_NAME, 
                    type: document.getElementById('type').value, size: document.getElementById('size').value,
                    location: document.getElementById('location').value, extId: document.getElementById('extId').value,
                    assetCode: document.getElementById('assetCode').value, year: document.getElementById('year').value,
                    img1_base64: base64Img1, img2_base64: base64Img2,
                    img1_name: file1 ? file1.name : "", img2_name: file2 ? file2.name : ""
                };

                const response = await fetch(CONFIG.GAS_URL, {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    alert("✅ " + result.message);
                    window.location.href = `list.html?dept=${deptKey}`; 
                } else {
                    alert("❌ ข้อผิดพลาด: " + result.message);
                }
            } catch (error) {
                alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อ: " + error.message);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
