<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการถังดับเพลิง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- หากไม่ต้องการใช้ไอคอนอีกต่อไป สามารถลบบรรทัด FontAwesome ด้านล่างนี้ออกได้เลยครับ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Sarabun', sans-serif; }
        .cursor-pointer { cursor: pointer; }
        .navbar-custom { background-color: #001f4d; } 
        #extinguisher-container img {
            max-width: 100px !important;
            max-height: 100px !important;
            object-fit: cover;
            border-radius: 8px;
        }
        #page-list { max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fs-6 fw-bold" href="#" id="dept-title-display">
                กำลังโหลด...
            </a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-1">
                    หน้าหลัก
                </a>
            </div>
        </div>
    </nav>

    <div id="page-list" class="container py-4">
        <div class="card border-0 shadow-sm mb-4 rounded-3">
            <div class="card-body p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="d-flex align-items-center">
                    <h6 class="mb-0 fw-bold me-3" style="color: #002454;">
                        รายการถังดับเพลิง
                    </h6>
                    <span id="ext-count" class="badge bg-primary rounded-pill px-3 py-2 fs-6" style="background-color: #1a73e8 !important;">0 ถัง</span>
                </div>
                <button class="btn btn-light border btn-sm px-3 text-secondary" onclick="clearCacheAndReload()"> รีเฟรช</button>
                <button class="btn btn-success btn-sm px-3 fw-bold rounded-pill" onclick="goToAddDataPage()" style="background-color: #2196f3; border-color: #2196f3;"> เพิ่มถังดับเพลิง</button>
            </div>
        </div>

        <div id="extinguisher-container" class="card border-0 shadow-sm rounded-3">
            <div class="card-body text-center text-muted py-5">กำลังดึงข้อมูล...</div>
        </div>
    </div>

    <div id="page-form" class="container py-4" style="max-width: 700px; display: none;">
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
                <span class="fw-bold text-dark fs-5"> บันทึกการตรวจสภาพ</span>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="showSection('page-list')"> ย้อนกลับ</button>
            </div>
            <div class="card-body bg-light">
                <form id="inspection-form">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">รหัสถังดับเพลิง / ครุภัณฑ์</label>
                        <input type="text" class="form-control bg-white" id="extinguisherId" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">สถานที่ติดตั้ง</label>
                        <input type="text" class="form-control bg-white" id="extinguisherLocation" readonly>
                    </div>
                    <div class="row mb-4">
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold">วันที่ตรวจ</label>
                            <input type="date" class="form-control bg-white" id="inspectionDate" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small fw-bold">ผู้ตรวจ</label>
                            <input type="text" class="form-control border-primary" id="inspectorName" placeholder="ชื่อผู้ตรวจ" required>
                        </div>
                    </div>
                    
                    <hr class="text-muted">
                    <h6 class="fw-bold mb-3 text-primary"> หัวข้อการตรวจสอบ (8 รายการ)</h6>
                    
                    <script>
                        const items = [
                            {id: 'body', label: '1. สภาพตัวถัง'}, {id: 'gauge', label: '2. แรงดันเกจ์'}, 
                            {id: 'hose', label: '3. สาย / หัวฉีด'}, {id: 'pin', label: '4. สลัก / ซีลล็อค'},
                            {id: 'lever', label: '5. คันบีบ'}, {id: 'label', label: '6. ป้ายแนะนำวิธีใช้'},
                            {id: 'installPoint', label: '7. ตำแหน่งติดตั้ง'}, {id: 'base', label: '8. ฐานตั้ง / ที่แขวน'}
                        ];
                        items.forEach(item => {
                            document.write(`
                            <div class="card mb-2 border-0 shadow-sm">
                                <div class="card-body p-3">
                                    <label class="fw-bold mb-2">${item.label}</label>
                                    <div class="d-flex gap-4">
                                        <div class="form-check"><input class="form-check-input" type="radio" name="${item.id}" id="${item.id}_pass" value="pass" checked onchange="toggleReason('${item.id}')"><label class="form-check-label text-success fw-bold" for="${item.id}_pass">ปกติ</label></div>
                                        <div class="form-check"><input class="form-check-input" type="radio" name="${item.id}" id="${item.id}_fail" value="fail" onchange="toggleReason('${item.id}')"><label class="form-check-label text-danger fw-bold" for="${item.id}_fail">ชำรุด</label></div>
                                    </div>
                                    <input type="text" class="form-control form-control-sm mt-2 d-none border-danger" id="${item.id}_reason" placeholder="ระบุสาเหตุ...">
                                </div>
                            </div>
                            `);
                        });
                    </script>

                    <div class="mb-4 mt-3">
                        <label class="form-label text-muted small fw-bold">หมายเหตุ (ถ้ามี)</label>
                        <textarea class="form-control" id="remark" rows="2" placeholder="ระบุหมายเหตุเพิ่มเติม..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-white shadow-sm" style="background-color: #002454; border-color: #002454;">
                        บันทึกข้อมูลการตรวจ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h6 class="modal-title fw-bold">
                        ประวัติการตรวจ (รหัส: <span id="historyAssetCode" class="text-primary"></span>)
                    </h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0"><div id="historyListContainer"></div></div>
                <div class="modal-footer p-2"><button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">ปิด</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
